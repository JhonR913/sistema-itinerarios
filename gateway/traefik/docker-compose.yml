services:
  traefik:
    image: traefik:v3.1
    # Solo proveedor de ARCHIVO: ya no se monta el socket de Docker (darle
    # el socket a un contenedor expuesto equivale a darle root del host).
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
      - "--accesslog=true"
    ports:
      - "80:80"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [itinerarios-net]

networks:
  itinerarios-net:
    external: true
