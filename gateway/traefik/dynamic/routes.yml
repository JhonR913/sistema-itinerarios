http:
  middlewares:
    rate-limit-default:
      rateLimit:
        average: 20
        burst: 40

  routers:
    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      service: auth-stub
      middlewares: ["rate-limit-default"]

    airport-router:
      rule: "PathPrefix(`/api/airports`)"
      service: airport-service
      middlewares: ["rate-limit-default"]

    itinerary-router:
      rule: "PathPrefix(`/api/itineraries`)"
      service: itinerary-service
      middlewares: ["rate-limit-default"]

    # Todo lo que NO sea /api va al frontend (http://localhost). La exclusion
    # de /api evita un bucle Traefik -> nginx -> Traefik en rutas /api/ inexistentes.
    frontend-router:
      rule: "!PathPrefix(`/api`)"
      priority: 1
      service: frontend

  services:
    auth-stub:
      loadBalancer:
        servers:
          - url: "http://auth-stub:8000"

    airport-service:
      loadBalancer:
        servers:
          - url: "http://airport-service:8000"

    itinerary-service:
      loadBalancer:
        servers:
          - url: "http://itinerary-service:8000"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:8080"
