server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (el sitio es publico por el tunel de Cloudflare). CSP sin scripts
    # externos ni inline: un XSS no puede cargar codigo ajeno. 'unsafe-inline' solo en estilos
    # (Plotly los inyecta). Cloudflare ya agrega HSTS si se activa en su panel.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    server_tokens off;

    # DNS interno de Docker + variable: nginx no falla al arrancar si Traefik
    # aun no existe, y re-resuelve si el contenedor cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway http://traefik:80;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
