services:
  frontend:
    build: .
    ports:
      - "127.0.0.1:5173:8080"   # acceso directo; el acceso normal es http://localhost (via Traefik)
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [itinerarios-net]

networks:
  itinerarios-net:
    external: true
