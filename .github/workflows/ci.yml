# CI del Sistema de Itinerarios Personales.
# No depende de secretos para lo esencial (tests, lint, build, compose).
# Opcionales: SONAR_TOKEN (+ variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY).
# Sin ellos el job de SonarCloud se OMITE (no falla). Ver docs/ci-y-calidad.md.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [airport-service, itinerary-service, auth-stub, notification-function]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      # Postgres real para las pruebas de integracion (outbox, idempotencia, migraciones).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Instalar dependencias (runtime + dev)
        run: pip install -r requirements-dev.txt
      - name: El lockfile instala con hashes (igual que el Dockerfile)
        run: pip install --dry-run --no-cache-dir --only-binary=:all: --require-hashes -r requirements.lock
      - name: Pruebas unitarias + integracion con cobertura
        run: python -m pytest tests -v --cov --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Rutas de cobertura relativas a la raiz (para SonarCloud)
        if: always()
        run: |
          [ -f coverage.xml ] && sed -i 's|filename="|filename="services/${{ matrix.service }}/|g' coverage.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      - name: Vulnerabilidades de dependencias de PRODUCCION (alta/critica falla)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  compose:
    name: Docker Compose (config + build de imagenes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar .env de CI (secretos aleatorios efimeros) y red
        run: ./scripts/bootstrap-env.sh
      - run: docker compose config -q
      - name: Build de las imagenes (valida Dockerfiles y lockfiles con hashes)
        run: docker compose build

  e2e:
    name: E2E con Docker Compose (humo + resiliencia)
    runs-on: ubuntu-latest
    needs: [compose]
    # AVISO: este job NO pudo ejecutarse en el entorno donde se escribio (sin
    # acceso a Docker Hub). Se deja como no bloqueante hasta su primera
    # ejecucion verde; despues quitar continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/bootstrap-env.sh
      - name: Levantar con proveedor de aeropuertos simulado (sin depender de internet)
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --build --wait --wait-timeout 240
      - name: Humo de extremo a extremo
        env:
          RABBIT_USER: itinerarios
        run: |
          export RABBIT_PASS="$(sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' services/itinerary-service/rabbitmq.env)"
          python3 scripts/e2e_smoke.py
      - name: Resiliencia (caida de RabbitMQ)
        run: python3 scripts/e2e_resilience.py
      - name: Logs si falla
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 120
      - if: always()
        run: docker compose down -v

  security:
    name: Seguridad (gitleaks + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Busqueda de secretos en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy (dependencias, secretos, configuracion) - informativo
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # informativo; pasar a "1" cuando el backlog de hallazgos este en cero

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Comprobar configuracion
        id: cfg
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_ORGANIZATION" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarCloud omitido: faltan SONAR_TOKEN (secret) y/o SONAR_ORGANIZATION / SONAR_PROJECT_KEY (variables)."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Colocar los reportes de cobertura donde los espera sonar-project.properties
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          for s in airport-service itinerary-service auth-stub notification-function; do
            [ -f coverage-artifacts/coverage-$s/coverage.xml ] && cp coverage-artifacts/coverage-$s/coverage.xml services/$s/coverage.xml
          done
          mkdir -p frontend/coverage
          [ -f coverage-artifacts/coverage-frontend/lcov.info ] && cp coverage-artifacts/coverage-frontend/lcov.info frontend/coverage/lcov.info || true
      - uses: SonarSource/sonarqube-scan-action@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      # Quality Gate: ver el resultado en SonarCloud (o agregar sonar.qualitygate.wait=true).
