
# Despliegue continuo: cuando el CI de main termina en verde,
# el runner propio construye y levanta la versión probada.
# El sitio sale a Internet mediante Cloudflare Tunnel.
#
# Este workflow nunca se dispara con pull requests.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en produccion
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, itinerarios]
    environment: production
    timeout-minutes: 30

    steps:
      # Descarga exactamente el commit que pasó el CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Despliegue en Windows mediante Git Bash.
      - name: Desplegar (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:COMPOSE_PROJECT = 'itinerarios-repo'
          $env:ITINERARIOS_CONFIG_DIR = Join-Path $env:USERPROFILE 'itinerarios-config'

          & "C:\Program Files\Git\bin\bash.exe" --noprofile --norc scripts/deploy.sh

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Despliegue en Linux o macOS.
      - name: Desplegar (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          COMPOSE_PROJECT=itinerarios-repo ./scripts/deploy.sh
