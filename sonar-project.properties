# SonarCloud. organization y projectKey se pasan desde el workflow
# (variables del repo SONAR_ORGANIZATION / SONAR_PROJECT_KEY) para no
# adivinar valores: deben coincidir con el proyecto creado en sonarcloud.io.
sonar.projectName=Sistema de Itinerarios Personales
sonar.sourceEncoding=UTF-8

sonar.sources=services,frontend/src
sonar.tests=services,frontend/src
sonar.test.inclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/alembic/versions/**,**/tests/**,**/__tests__/**,frontend/public/**,**/*.d.ts

sonar.python.version=3.11
sonar.python.coverage.reportPaths=services/airport-service/coverage.xml,services/itinerary-service/coverage.xml,services/auth-stub/coverage.xml,services/notification-function/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=**/alembic/**,**/tests/**,**/main.tsx,**/*.d.ts,**/types/**
