services:
  # API: aplica las migraciones Alembic al arrancar y luego sirve HTTP.
  itinerary-service:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres-itinerary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks: [itinerarios-net]

  # Relay del Transactional Outbox: outbox (PostgreSQL) -> RabbitMQ.
  # Misma imagen; NO ejecuta migraciones (espera a que la API este sana).
  outbox-worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.infrastructure.adapters.outbox_worker"]
    depends_on:
      itinerary-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [itinerarios-net]

  postgres-itinerary:
    image: postgres:16-alpine
    env_file: db.env
    volumes:
      - itinerary-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [itinerarios-net]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    env_file: rabbitmq.env
    ports:
      - "127.0.0.1:15672:15672"   # consola de administracion, solo local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [itinerarios-net]

volumes:
  itinerary-db-data:

networks:
  itinerarios-net:
    external: true
