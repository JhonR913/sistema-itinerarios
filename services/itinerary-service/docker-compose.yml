services:
  itinerary-service:
    build: .
    env_file: .env
    ports:
      - "8002:8000"
    depends_on: [postgres-itinerary, rabbitmq]
    networks: [itinerarios-net]

  outbox-worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.infrastructure.adapters.outbox_worker"]
    depends_on: [postgres-itinerary, rabbitmq]
    networks: [itinerarios-net]

  postgres-itinerary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itinerary
      POSTGRES_USER: itinerary
      POSTGRES_PASSWORD: itinerary
    volumes:
      - itinerary-db-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks: [itinerarios-net]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "15672:15672"
    networks: [itinerarios-net]

volumes:
  itinerary-db-data:

networks:
  itinerarios-net:
    external: true
