services:
  postgres-notification:
    image: postgres:16-alpine
    env_file: db.env
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [itinerarios-net]

  # OpenFaaS real requiere su stack completo (gateway + faas-cli).
  # Para desarrollo local simplificado, este contenedor consume RabbitMQ
  # directamente e invoca handler.py por cada mensaje.
  send-notification-function:
    build: .
    env_file: .env
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [itinerarios-net]

  # Proceso programado de recordatorios: envia por SMTP los vencidos.
  reminder-worker:
    build: .
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && exec python reminder_worker.py"]
    depends_on:
      postgres-notification:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    networks: [itinerarios-net]

  # SMTP de desarrollo: captura los correos, no los entrega a nadie.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"   # interfaz web para ver los correos
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [itinerarios-net]

volumes:
  notification-db-data:

networks:
  itinerarios-net:
    external: true
