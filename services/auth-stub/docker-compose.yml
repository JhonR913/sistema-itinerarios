services:
  auth-stub:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [itinerarios-net]

networks:
  itinerarios-net:
    external: true
